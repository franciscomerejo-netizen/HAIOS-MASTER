name: Deploy HAIOS Public Live Alpha

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify V24 repository deployment preflight
        run: node deployments/deploy-orchestrator.v24.mjs
      - name: Verify public-state guardrails
        run: cd public-portal && node scripts/verify-public-state.mjs
      - name: Verify legal-document integrity lock
        run: node scripts/verify-legal-integrity.v24.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy static portal to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-portal --project-name=haios-global-alpha
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
